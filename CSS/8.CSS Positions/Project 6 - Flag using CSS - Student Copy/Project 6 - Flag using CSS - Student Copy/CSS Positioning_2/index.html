<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Box and Circle Layout</title>
   <style>
    body {
  margin: 0;
  padding: 0;
  background-color: white;
}

.container {
  width: 900px;
  height: 700px;
  position: relative;
}

/* Blue rectangle */
.blue-box {
  width: 500px;
  height: 300px;
  background-color: blue;
  position: absolute;
  top: 200px;
  left: 200px;
}

/* Red circle inside blue box */
.red-circle {
  width: 200px;
  height: 200px;
  background-color: red;
  border-radius: 50%;
  position: absolute;
  top: 150px;   
  left: 250px;  
}

   </style>
</head>
<body>
  <div class="container">
    <div class="blue-box">
      <div class="red-circle"></div>
    </div>
  </div>
</body>
</html>
