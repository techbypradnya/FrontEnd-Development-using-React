<!DOCTYPE html>
<html lang="en">
  <!-- 
    IMPORTANT! Do not change any HTML
    Don't add any classes/ids/elements 
    Use what you know about combining selectors 
    and CSS specificity instead.
    Hint 1: The flag is 900px by 600px and the circle is 200px by 200px.
    Hint 2: You can use CSS inspection to get the colors
  -->
  <head>
    <meta charset="UTF-8" />
    <title>CSS Flag Project</title>
    <style>
      /* Write your CSS Code here */
      .flag > p {
        width: 900px;
        height: 600px;
        background-color: #c8102e;
        position: relative;
        text-align: center;
        
      }

      .flag > div > div > p {
        color: black;
        font-size: 25px;
        margin: 60px 0 0 0;
      
      }
      .flag > div > div {
        width: 200px;
        height: 200px;
        background-color: white;
        border-radius: 50%;
        position: absolute;
        top: 100px;
        left: 350px;
        right: 350px;;
        text-align: center;
      }
      .flag > div {
        width: 900px;
        height: 400px;
        background-color: navy;
        position: absolute;
        top: 100px;
        bottom: 100px;
        
        bottom: 100px;
        z-index: 1;

      }
      div > p{
        font-size: 40px;
        color: white;
        bottom: 30px;

      }
    </style>
  </head>

  <body>
    <div class="flag">
      <p>The Flag</p>
      <div>
        <div>
          <p style="font-size: 40px;">of Laos</p>
        </div>
      </div>
    </div>
  </body>
</html>
