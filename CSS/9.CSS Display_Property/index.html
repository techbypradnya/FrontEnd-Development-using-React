<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
       
        p{
            color: white;
            font-size: 20px;
            text-align: center;
            margin-top: 80px;
            font-weight: bold;
        }
        .aa{
            height: 200px;
            width: 200px;
            border: 5px solid black;
            background-color: red;
            display: inline-block;
        }
        .bb{
            height: 200px;
            width: 200px;
            border: 5px solid black;
            background-color: green;
            display: inline-block;
        }
        .cc{
            height: 200px;
            width: 200px;
            border: 5px solid black;
            background-color: yellow;
            display: inline-block;
        }
    </style>
</head>
<body>
    <h1>
        CSS Display Property
    </h1>
    <div class="aa">
        <p id="a"> red</p>
    </div>
    <div class="bb">
        <p id="b">green</p>
    </div>
    
    <div class="cc">
        <p id="c">yellow</p>
    </div>
</body>
</html>
