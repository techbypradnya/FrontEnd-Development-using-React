<!DOCTYPE html>
<html>

<head>
  <title>Chessboard</title>
  <style>
    /* Each square should be 100px by 100px */
    /* Use colours - white: #f0d9b5, black: #b58863 */
    
    .container {
      display: grid;
      grid-template-columns: repeat(8, 100px);
      grid-template-rows: repeat(8, 100px);
      width: 800px;
      margin: 50px auto;
      border: 4px solid #333;
    }

    .white {
      background-color: #f0d9b5;
      width: 100px;
      height: 100px;
    }

    .black {
      background-color: #b58863;
      width: 100px;
      height: 100px;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="white"></div>
    <div class="black"></div>

    <div class="black"></div>
