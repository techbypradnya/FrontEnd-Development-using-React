<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Pricing Tables</title>
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: sans-serif;
        background-color: #f7efef;
        text-align: center;
        padding: 20px;
      }

      .pricing-table {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 30px;
        flex-direction: row;
      }

      .plan {
        background: #ebe5e5;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        width: 250px;
        padding: 25px;
      }

      .plan h2 {
        font-size: 16px;
        margin-bottom: 10px;
      }

      .price {
        font-size: 26px;
        font-weight: bold;
      }

      .price span {
        font-size: 16px;
        font-weight: normal;
      }

      .features {
        margin: 20px 0;
        font-size: 14px;
        line-height: 2;
        text-align: left;
      }

      .features .true::before {
        /* content: "✅"; */
        margin-right: 8px;
      }

      .features .false::before {
        /* content: "❌"; */
        margin-right: 8px;
      }

      .plan button {
        background-color: orange;
        color: white;
        border: none;
        padding: 8px 16px;
        border-radius: 4px;
        cursor: pointer;
        font-family: inherit;
      }
    </style>
  </head>
  <body>
    <div class="pricing-table">
      <div class="plan">
        <h2>Basic</h2>
        <div class="price">$11.99<span>/month</span></div>
        <div class="features">
          <div class="true">10GB Storage</div>
          <div class="true">1 User</div>
          <div class="false">Support</div>
        </div>
        <button>Sign Up</button>
      </div>

      <div class="plan">
        <h2>Standard</h2>
        <div class="price">$19.99<span>/month</span></div>
        <div class="features">
          <div class="true">50GB Storage</div>
          <div class="true">5 Users</div>
          <div class="true">Phone & Email Support</div>
        </div>
        <button>Sign Up</button>
      </div>

      <div class="plan">
        <h2>Premium</h2>
        <div class="price">$49.99<span>/month</span></div>
        <div class="features">
          <div class="true">100GB Storage</div>
          <div class="true">10 Users</div>
          <div class="true">Phone & Email Support</div>
        </div>
        <button>Sign Up</button>
      </div>
    </div>
  </body>
</html>
